# Full-journey app tests with Maestro on an Android emulator (NMX-56), against STAGING.
# Manual only (Actions → "App journey (Maestro)" → Run workflow): each run creates test members on staging, books and
# cancels on the mock payment page, then deletes the members. Never point it at production.
name: App journey (Maestro)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: 3.47.9
      FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          curl -sSfLo /tmp/flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  /tmp/flutter.tar.xz" | sha256sum -c
          tar -xJf /tmp/flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Build a debug APK for staging
        working-directory: qatar/app
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter build apk --debug --dart-define=HZ_ENV=staging
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows on an Android 14 emulator (the app starts in Arabic)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install qatar/app/build/app/outputs/flutter-apk/app-debug.apk
            maestro test qatar/app/.maestro --format junit --output maestro-report.xml
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
          if-no-files-found: ignore
