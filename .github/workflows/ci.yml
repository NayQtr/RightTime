# Full test suite on every push and pull request: the Vercel build gate (syntax, tests without a database, npm audit),
# then every API, database and browser test (Postgres 16 service, Chromium). Runs on GitHub-hosted runners, which are
# free for public repositories.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST_PSQL: localhost
      PGHOST_TCP: localhost
      PGPORT: "5433"
      PGUSER: app
    defaults:
      run:
        working-directory: qatar/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qatar/api/package-lock.json
      - name: Install
        run: |
          npm ci
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Build gate (same checks as every Vercel deploy)
        run: node ../ops/predeploy-gate.mjs
      - name: All tests (API, database, browser)
        run: npm test
      - name: Screenshots from the browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/rightime-ui-shots
          if-no-files-found: ignore

  # Mobile app (qatar/app, Flutter): static analysis, unit and widget tests, screenshot comparison. The SDK is the
  # pinned stable release, downloaded from Google and checked against its published SHA-256.
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: 3.47.9
      FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
    defaults:
      run:
        working-directory: qatar/app
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          curl -sSfLo /tmp/flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  /tmp/flutter.tar.xz" | sha256sum -c
          tar -xJf /tmp/flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter pub get
      - name: Tokens match the design source
        run: python3 ../design/build_tokens_dart.py && git diff --exit-code lib/design/herzone_tokens.dart
      - name: No known vulnerabilities in app packages (OSV)
        run: python3 tool/osv_check.py
      - run: flutter analyze
      - run: flutter test
