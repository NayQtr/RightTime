<title>HerZone معاينة الأفكار العشر</title>

<style>
/* Layout: one phone-width HerZone column; a preview switcher above it moves between five screens. */
:root {

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --on-primary: #241620; --border: #5C4451; --border-strong: #9A8290; --brand: #F2D9ED; --tint-y: #4A3F1C; --tint-m: #3E2433; --page: #170D14; color-scheme: dark } }
:root[data-theme="dark"] {

  --on-primary: #241620; --border: #5C4451; --border-strong: #9A8290; --brand: #F2D9ED; --tint-y: #4A3F1C; --tint-m: #3E2433; --page: #170D14; color-scheme: dark }

.wrap { max-width: 430px; margin: 0 auto; padding-block: 12px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.pv { display: grid; gap: 8px; margin-bottom: 12px; }

.ideas b { color: var(--text); }

.tmp::after { content: "نص مؤقت"; position: absolute; inset-block-start: -11px; inset-inline-end: 6px; font: 600 10px var(--body); background: var(--accent); color: var(--on-accent); padding: 0 6px; border-radius: 6px; line-height: 16px; }
.btn .tmp::after, .chipx.tmp::after, .lab .tmp::after, .ck-row .tmp::after, .msg .tmp::after, .pick.tmp::after, .rc .tmp::after, .know .tmp::after, .link.tmp::after, .dock .tmp::after, .under.tmp::after, figcaption.tmp::after { display: none; }
.tmp::after { display: none; }
.wrap.wide { max-width: 1100px; }
/* the app */
.app { background: var(--bg); border-radius: 28px; overflow: clip; box-shadow: 0 0 0 1px var(--border), 0 30px 60px -40px #000; min-height: 720px; position: relative; }
.top { display: flex; align-items: center; justify-content: space-between; margin: 10px; padding: 8px 16px; border-radius: 999px; background: var(--surface); }

.btn-s { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border-strong); }
em.hl { font-style: normal; background: var(--accent); color: var(--on-accent); padding: 0 10px; border-radius: 8px; }

/* quiz: 2 Framer + 3 Duolingo */
.bar { height: 8px; border-radius: 8px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; height: 100%; width: 10%; background: var(--primary); border-radius: 8px; transition: width .4s var(--ease); }
.qhead { min-height: 96px; display: grid; gap: 4px; align-content: start; }

.reply { display: flex; gap: 12px; align-items: center; }
.reply svg { width: 56px; height: 56px; flex: none; }
.tbl .t { fill: var(--sunken); stroke: var(--border); stroke-width: 1.5; } .tbl .s { fill: none; stroke: var(--border-strong); stroke-width: 1.5; stroke-dasharray: 3 3; transition: fill .4s var(--ease); } .tbl .s.on { fill: var(--primary); stroke: var(--primary); stroke-dasharray: none; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 0 16px 0 20px; border-radius: 16px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--border); cursor: pointer; font-weight: 500; text-align: start;
  transition: opacity .15s var(--ease), background-color .25s var(--ease), box-shadow .25s var(--ease), color .25s var(--ease); }
.opt:active { opacity: 0.6; }
.opt .ck { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--border-strong); display: grid; place-items: center; flex: none; transition: background-color .25s var(--ease), box-shadow .25s var(--ease); }
.opt .ck::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--on-primary); border-bottom: 2px solid var(--on-primary); transform: rotate(-45deg) translateY(-1px); opacity: 0; transition: opacity .2s var(--ease); }
.opt[aria-pressed="true"] { background: var(--subtle); box-shadow: inset 0 0 0 2px var(--primary); color: var(--primary); font-weight: 600; }
.opt[aria-pressed="true"] .ck { background: var(--primary); box-shadow: none; } .opt[aria-pressed="true"] .ck::after { opacity: 1; }
/* home: 6 Notion tiles, 10 Airbnb week filter, 9 MUJI peek row */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border: 0; border-radius: 16px; padding: 14px; text-align: start; cursor: pointer; display: grid; gap: 2px; background: var(--tint-m); transition: background-color .2s var(--ease), box-shadow .2s var(--ease); position: relative; overflow: hidden; min-height: 92px; }

.tile svg .dot { fill: var(--accent); stroke: none; }
.tile[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--primary); }
.week { display: flex; gap: 4px; justify-content: space-between; }
.day { flex: 1; min-width: 0; height: 56px; border-radius: 14px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 0; font-size: 11px; color: var(--muted); position: relative; transition: box-shadow .2s var(--ease), opacity .2s; }

.day[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--primary); }
.count { font-size: 14px; color: var(--muted); }
.count b { color: var(--text); font-variant-numeric: tabular-nums; }
.peek { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -20px; padding: 4px 20px 14px; scrollbar-width: none; list-style: none; margin-block: 0; }
.peek li { flex: 0 0 272px; scroll-snap-align: start; transition: opacity .2s var(--ease), transform .2s var(--ease); }
.card { background: var(--surface); border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--border), 0 14px 30px -22px #000; }
.card img { display: block; width: 100%; aspect-ratio: 4 / 3.3; object-fit: cover; }
.card .bd { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 12px 14px 14px; }
.date { text-align: center; background: var(--subtle); color: var(--primary); border-radius: 14px; padding: 6px 2px; line-height: 1.2; }
.date b { display: block; font: 800 22px var(--display); } .date span { font-size: 11px; }
.card strong { font-family: var(--display); font-weight: 700; display: block; line-height: 1.4; } .card .m { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
/* 5 Linear: framed next-meetup card, rows one by one */
.frame { padding: 6px; border-radius: 20px; background: color-mix(in oklch, var(--primary) 8%, transparent); }
.frame .in { border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--primary) 22%, transparent); padding: 16px; display: grid; gap: 12px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); animation: sharp .28s cubic-bezier(.32,.72,0,1) both; animation-delay: calc(200ms + var(--i) * 60ms); }

.about .tall { aspect-ratio: 4 / 5; } .about .wide { aspect-ratio: 16 / 9; } .about img { width: 100%; object-fit: cover; display: block; }
/* ---- round 4 (redo): the core seed. HerZone's own screens and tokens; each idea adds life without changing the identity ---- */
.app.bleed .top { position: absolute; inset-inline: 10px; top: 0; z-index: 6; background: color-mix(in oklch, var(--surface) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.scr.fb { padding-top: 0; }
.full { margin-inline: -20px; position: relative; overflow: hidden; }
.ph { position: absolute; inset: 0; background-size: cover; background-position: center; }
/* the table motif exactly as the site draws it: a ring, filled seats in the primary colour, free seats dashed */
.mot .t { fill: var(--sunken); stroke: var(--border); stroke-width: 1.5; } .mot .s { fill: none; stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 4 4; } .mot .s.on { fill: var(--primary); stroke: var(--primary); stroke-dasharray: none; }
.h-wel { font-weight: 800; font-size: 30px; }
/* welcome A: the photo melts into the page colour; the table sits on its edge in a frosted badge */
.wa-ph { height: 450px; } .wa-ph .ph { animation: settle2 1.2s var(--ease) both; }
@keyframes settle2 { from { transform: scale(1.06); } to { transform: none; } }

.badge { position: relative; z-index: 2; width: 84px; height: 84px; border-radius: 50%; margin: -76px 0 0; display: grid; place-items: center; background: color-mix(in oklch, var(--surface) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 0 0 1px var(--border), 0 14px 30px -18px #000; }
.badge svg { width: 60px; height: 60px; }
/* welcome B: the site's own table diagram, with a real table photographed inside it; seats arrive one by one */
.tbl-ph { position: relative; width: 300px; height: 300px; margin: 4px auto; }
.tbl-ph .disc { position: absolute; inset: 62px; border-radius: 50%; background-size: cover; background-position: center; box-shadow: 0 0 0 3px var(--border), 0 20px 40px -24px #000; animation: photo 1.1s var(--ease) both; }
.tbl-ph .seat { position: absolute; width: 44px; height: 44px; border-radius: 50%; margin: -22px; animation: pop .35s cubic-bezier(.25,1,.33,1) both; animation-delay: calc(500ms + var(--i) * 110ms); }

.qtop { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 14px; }
.qline { display: flex; align-items: center; gap: 10px; color: var(--primary); font-weight: 600; font-size: 14px; }
.qline svg { width: 40px; height: 40px; flex: none; } .qline .s { transition: fill .3s var(--ease), stroke .3s; }
.opt.dep { box-shadow: inset 0 0 0 1.5px var(--border), 0 3px 0 var(--border); transition: transform .1s var(--ease), box-shadow .1s var(--ease), background-color .25s var(--ease), color .25s; }

.opt.dep .ck { border-radius: 7px; }
/* questionnaire B: the real "how it works" screen with a small drawing in the site's own tints */
.circles { display: flex; justify-content: center; padding: 6px 0 2px; }

.circles span:nth-child(1) { margin: 0; background: var(--subtle); } .circles span:nth-child(2) { background: var(--surface); box-shadow: 0 0 0 1px var(--border); animation-delay: 80ms; margin-top: 28px; z-index: 1; } .circles span:nth-child(3) { background: var(--sunken); animation-delay: 160ms; }
.circles svg { width: 52px; height: 52px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.circles .dotf { fill: currentColor; stroke: none; }
/* home: the site's meetup card (date leaf, title, district and time, arrow), shared by the three variants */
.ev { display: grid; grid-template-columns: 60px 1fr 20px; gap: 16px; align-items: center; padding: 16px; }
.leaf { text-align: center; background: var(--subtle); color: var(--primary); border-radius: 16px; padding: 8px 4px; line-height: 1.15; }
.leaf b { display: block; font: 800 28px var(--display); font-variant-numeric: tabular-nums; } .leaf span { font-size: 12px; }
.ev strong { font: 700 16px/1.5 var(--display); display: block; } .ev .m { color: var(--muted); font-size: 13px; } .ev .ar { color: var(--muted); font-size: 20px; }
.evc { background: var(--surface); border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--border), 0 10px 24px -18px #000; }
.wk-label { font-size: 13px; font-weight: 600; color: var(--muted); }
/* home A: a soft tint of the brand's own pink behind the heading; the week floats; each card opens with its photo */
.ha-top { margin: 0 -20px; padding: 76px 20px 8px; background: radial-gradient(80% 90% at 80% 0%, var(--subtle), transparent 72%); display: grid; gap: 12px; }
.wk-card { background: var(--surface); border-radius: 20px; padding: 10px 8px; box-shadow: 0 0 0 1px var(--border), 0 16px 32px -22px #000; }
.evc .shot { height: 168px; position: relative; overflow: hidden; } .evc .shot .ph { transition: transform .8s var(--ease); } .evc:active .shot .ph { transform: scale(1.04); }

@keyframes drift { from { transform: scale(1); } to { transform: scale(1.05); } }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 35%, rgb(43 26 36 / 0.82) 100%); }
.banner .txt { position: absolute; z-index: 2; inset: auto 18px 18px; display: grid; gap: 4px; }
.banner h2 { font-size: 24px; color: #FFFAF4; } .banner p { color: #F3DCE8; font-size: 14px; } .banner .btn { margin-top: 10px; min-height: 48px; }
.banner .lf { position: absolute; z-index: 2; top: 16px; inset-inline-start: 16px; width: 64px; background: color-mix(in oklch, var(--surface) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
/* home C: the date leads; the table at the end shows the seats already taken */
.ev.big { grid-template-columns: 84px 1fr 52px; } .ev.big .leaf { padding: 12px 4px; border-radius: 20px; } .ev.big .leaf b { font-size: 40px; }
.ev.big strong { font-size: 18px; } .ev.big svg { width: 52px; height: 52px; } .leaf.cof { background: var(--sunken); color: var(--text); }
/* details: the site's facts list (icon, label, value on hairlines) and the reveal note, shared by the three variants */
.dfacts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.dfacts li { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--border); font-size: 15px; }
.dfacts svg { width: 20px; height: 20px; stroke: var(--primary); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; } .dfacts b { margin-inline-start: auto; font-weight: 600; }
.note2 { background: var(--subtle); border-radius: 16px; padding: 12px 16px; font-size: 14px; }
/* details A: three photos of the evening's mood, fanned once, on the site's sunken tone */
.fan { background: var(--sunken); height: 300px; border-radius: 0 0 28px 28px; display: grid; place-items: end center; padding-bottom: 28px; }
.fan .cards { position: relative; width: 180px; height: 180px; }
.fan .cd { position: absolute; border-radius: 20px; background-size: cover; background-position: center; border: 3px solid var(--surface); }
.fan .c0 { inset: 0; z-index: 2; box-shadow: 0 30px 50px -20px rgb(43 26 36 / 0.45); }
.fan .c1, .fan .c2 { width: 132px; height: 160px; top: 14px; box-shadow: 0 13px 22px -8px rgb(43 26 36 / 0.35); animation: fanL .6s var(--ease) both .1s; }
.fan .c1 { left: -82px; --r: -9deg; } .fan .c2 { right: -82px; --r: 9deg; animation-name: fanR; animation-delay: .18s; }
